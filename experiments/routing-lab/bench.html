<!doctype html><meta charset="utf-8"><title>Client-side routing experiment</title><script type="module">
window.run=(manifest,settings,engine)=>new Promise((resolve,reject)=>{const worker=new Worker(new URL('./worker.ts',import.meta.url),{type:'module'});worker.onmessage=({data})=>{worker.terminate();data.error?reject(new Error(data.error)):resolve(data)};worker.onerror=e=>{worker.terminate();reject(new Error(e.message))};worker.postMessage({manifest,settings,engine})});window.ready=true;
</script>
